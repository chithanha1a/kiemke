<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="/ui.css"><title>Đăng nhập kiểm kê</title><body><h1>Kiểm kê thiết bị</h1><section><form id="login"><input name="username" placeholder="Tài khoản" autocomplete="username" required><input name="password" type="password" placeholder="Mật khẩu" autocomplete="current-password" required><button>Đăng nhập</button></form><p id="msg"></p></section><details><summary>Khởi tạo admin lần đầu</summary><form id="setup"><input name="token" type="password" placeholder="SETUP_TOKEN" required><input name="username" value="admin" required><input name="password" type="password" minlength="12" placeholder="Mật khẩu admin (12+ ký tự)" required><button>Khởi tạo</button></form></details><script>
for(const [id,path] of [['login','login'],['setup','bootstrap']])document.getElementById(id).onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/auth/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const j=await r.json();document.getElementById('msg').textContent=j.message;if(j.ok&&id==='login')location.href='/'}catch(e){document.getElementById('msg').textContent=e.message}};
</script></body></html>
